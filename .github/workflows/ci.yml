name: CI - Build & Test Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Compile and Run Java Preflight Self-Test
        run: |
          New-Item -ItemType Directory -Force -Path build/classes
          javac -d build/classes src/tools/CP2077PreflightVerifier.java
          java -cp build/classes com.cp2077.tools.CP2077PreflightVerifier --test

      - name: Compile and Run Architecture Test Harness
        run: |
          javac -d build/classes src/tools/TestHarness.java
          java -cp build/classes com.cp2077.tools.TestHarness

      - name: Run Staging Script Regression Test Suite
        shell: pwsh
        run: |
          ./tests/Test-HardenedStaging.ps1
