# VKD3D-Proton Configuration for Cyberpunk 2077 on Adreno 644 (Turnip)
# Low-memory & stability optimizations for mobile translation

# Disable DXR / Ray Tracing completely to avoid unsupported Vulkan ray tracing extensions
vkd3d_feature_level = 12_0
vkd3d_raytracing = 0

# Limit descriptor heap size to reduce mobile VRAM consumption
vkd3d_descriptor_heap_size = 65536

# Workarounds for Turnip Adreno Vulkan driver
vkd3d_config = no_upload_hvv,force_static_cbv

# Disable debug overlays and validation layers for performance
vkd3d_debug = none
